name: Deploy Flask API to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Package application
        run: |
          zip -r task-management.zip . -x ".git/*" ".github/*" "*.zip"

      - name: Deploy to Elastic Beanstalk
        env:
          VERSION_LABEL: github-${{ github.run_number }}
          S3_BUCKET: elasticbeanstalk-ap-south-1-343644157719
          S3_KEY: task-management.zip
        run: |
          aws s3 cp task-management.zip "s3://$S3_BUCKET/$S3_KEY"

          aws elasticbeanstalk create-application-version \
            --application-name task-management-app \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="$S3_KEY"

          aws elasticbeanstalk update-environment \
            --environment-name task-management-env \
            --version-label "$VERSION_LABEL"

          aws elasticbeanstalk wait environment-updated \
            --application-name task-management-app \
            --environment-names task-management-env
